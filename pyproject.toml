[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "camh-cufe"
version = "0.1.0.dev0"
description = "Research implementation of Composable Auditable Multi-Hop Ciphertext-Update Functional Encryption"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
